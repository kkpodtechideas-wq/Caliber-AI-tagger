# Calibre-Web Nginx Configuration
# Location on VPS: /etc/nginx/sites-available/calibre-web
# SSL managed by Certbot

server {
    listen 80;
    server_name kirillbooks.duckdns.org;
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Note: Certbot automatically adds SSL configuration.
# To renew: sudo certbot renew
# To recreate: sudo certbot --nginx -d kirillbooks.duckdns.org
